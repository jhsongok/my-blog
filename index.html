<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // 테마 깜빡임 방지: CSS보다 먼저, 동기적으로 저장된 테마를 적용합니다.
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) { /* 저장소 접근 불가 시 OS 설정을 따릅니다 */ }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> My Blog</p>
    </div>
  </footer>
</body>
</html>
